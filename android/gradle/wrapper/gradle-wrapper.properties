# Configures the Gradle Wrapper for consistent builds across environments
# Connects to: All Gradle tasks (determines Gradle version used)

# Base directory for Gradle distribution
distributionBase=GRADLE_USER_HOME

# Path for storing Gradle distribution
distributionPath=wrapper/dists

# Base directory for storing zipped Gradle distributions
zipStoreBase=GRADLE_USER_HOME

# Path for storing zipped Gradle distributions
zipStorePath=wrapper/dists

# URL for downloading the Gradle distribution
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip