# Configures global Gradle settings for the entire project
# Connects to: All Gradle builds (affects settings.gradle.kts, android/build.gradle.kts, android/app/build.gradle.kts)

# JVM arguments for Gradle to optimize memory usage and debugging
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX libraries for modern Android development
android.useAndroidX=true

# Enable Jetifier to migrate legacy support libraries to AndroidX
android.enableJetifier=true